<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bp-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#1f1325" />
    </linearGradient>
    <linearGradient id="bp-pink" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff659b" />
      <stop offset="50%" stop-color="#ff2d75" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bp-bg)" stroke="#ff2d75" stroke-width="2.5" />
  
  <!-- Subtle Inner Glow Border -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#ff2d75" stroke-opacity="0.3" stroke-width="1" />

  <!-- Crown / Idol Element (Top) -->
  <path d="M22 23L26 27L32 18L38 27L42 23L40 31H24L22 23Z" fill="url(#bp-pink)" filter="url(#glow)" />
  <circle cx="32" cy="18" r="1.5" fill="#ffffff" />
  <circle cx="22" cy="23" r="1.2" fill="#ffd1dc" />
  <circle cx="42" cy="23" r="1.2" fill="#ffd1dc" />

  <!-- Bold Media Download Arrow (Middle/Bottom) -->
  <path d="M32 29V43M32 43L25 36M32 43L39 36" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M22 47H42" stroke="url(#bp-pink)" stroke-width="3" stroke-linecap="round" />

  <!-- Sparkling Glitter Stars (Kim tuyến lấp lánh) -->
  <!-- Top Right Glitter -->
  <path d="M49 11L50 14L53 15L50 16L49 19L48 16L45 15L48 14Z" fill="#fcd34d" />
  <circle cx="49" cy="15" r="0.8" fill="#ffffff" />

  <!-- Bottom Left Glitter -->
  <path d="M14 43L14.7 45.3L17 46L14.7 46.7L14 49L13.3 46.7L11 46L13.3 45.3Z" fill="#ff75a0" />

  <!-- Top Left Small Sparkle -->
  <circle cx="15" cy="18" r="1.2" fill="#ffffff" opacity="0.9" />
  <circle cx="51" cy="41" r="1.2" fill="#ff2d75" opacity="0.8" />
</svg>
