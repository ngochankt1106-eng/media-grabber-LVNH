<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <defs>
    <linearGradient id="apple-bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="100%" stop-color="#1f1124" />
    </linearGradient>
    <linearGradient id="apple-pink" x1="20" y1="20" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff659b" />
      <stop offset="50%" stop-color="#ff2d75" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
    <filter id="glow-apple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="180" height="180" rx="42" fill="url(#apple-bg)" />
  <rect x="4" y="4" width="172" height="172" rx="38" fill="none" stroke="#ff2d75" stroke-width="4" stroke-opacity="0.8" />

  <!-- Crown Elements -->
  <path d="M55 68L70 80L90 52L110 80L125 68L120 92H60L55 68Z" fill="url(#apple-pink)" filter="url(#glow-apple)" />
  <circle cx="90" cy="52" r="4" fill="#ffffff" />
  <circle cx="55" cy="68" r="3.5" fill="#ffd1dc" />
  <circle cx="125" cy="68" r="3.5" fill="#ffd1dc" />

  <!-- Arrow -->
  <path d="M90 86V124M90 124L70 104M90 124L110 104" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M60 138H120" stroke="url(#apple-pink)" stroke-width="8" stroke-linecap="round" />

  <!-- Sparkles -->
  <path d="M142 34L145 42L153 45L145 48L142 56L139 48L131 45L139 42Z" fill="#fcd34d" />
  <path d="M38 120L40 126L46 128L40 130L38 136L36 130L30 128L36 126Z" fill="#ff75a0" />
  <circle cx="42" cy="46" r="3" fill="#ffffff" opacity="0.9" />
  <circle cx="146" cy="118" r="3" fill="#ff2d75" opacity="0.8" />
</svg>
